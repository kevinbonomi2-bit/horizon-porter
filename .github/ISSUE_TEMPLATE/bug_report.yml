name: Something does not work
description: A crash, an error, or a command or the app doing the wrong thing
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "`horizon-porter --version`, or the app's release"
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app
        - Command line
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Windows 11, macOS 15 (Apple Silicon), Ubuntu 24.04..."
    validations:
      required: true
  - type: input
    id: mod
    attributes:
      label: The mod
      description: A link to its public source, if it has one. Please do not attach other people's jars.
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The command you ran, or the steps in the app
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
