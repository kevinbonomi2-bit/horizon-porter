name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # GitHub's macOS runners are sometimes unavailable for a long time; Linux and
    # Windows are the required checks.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      # The saved API key is read through the system keyring: D-Bus on Linux.
      - name: Install system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # The desktop app has its own job: it needs system libraries on Linux.
      - name: Lint
        run: cargo clippy --workspace --exclude horizon-porter-app --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude horizon-porter-app --locked

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Lint
        run: cargo clippy -p horizon-porter-app --all-targets --locked -- -D warnings

      # Builds a real installer, so bundling problems show before a release.
      - name: Bundle
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --ci
