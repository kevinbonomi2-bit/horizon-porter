[package]
name = "porter-translate"
description = "Translates Java mods to Horizon native mod bundles: rule-based bundle generation now, AI-assisted method translation later."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
porter-content = { path = "../porter-content" }
porter-map = { path = "../porter-map" }
porter-model = { path = "../porter-model" }
serde_json = "1.0.154"
toml = "1.2.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
porter-java = { path = "../porter-java" }
