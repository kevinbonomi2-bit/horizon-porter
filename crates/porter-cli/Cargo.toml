[package]
name = "porter-cli"
description = "The horizon-porter command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "horizon-porter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
porter-java = { path = "../porter-java" }
porter-model = { path = "../porter-model" }
porter-report = { path = "../porter-report" }
porter-translate = { path = "../porter-translate" }
serde_json = "1.0.154"
