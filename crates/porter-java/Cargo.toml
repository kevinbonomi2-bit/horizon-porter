[package]
name = "porter-java"
description = "Reads a Java mod: source, loader metadata, Mixin configs, assets and data."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
porter-model = { path = "../porter-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
tree-sitter = "0.27.1"
tree-sitter-java = "0.23.5"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
